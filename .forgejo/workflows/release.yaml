name: release

# Tag pushes (v*) publish the operator image and Helm chart. Tagging from a
# release in the Codeberg UI also creates the tag, so either path triggers this.
#
# The image is assembled with `ko` (no Docker daemon / privileged runner needed).
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: codeberg.org
  KO_DOCKER_REPO: codeberg.org/ccbash-oss/netbird-operator
  KO_DEFAULTBASEIMAGE: gcr.io/distroless/static:nonroot
  CHART_OCI: oci://codeberg.org/ccbash-oss/helm-charts

jobs:
  image:
    runs-on: docker
    container:
      image: golang:1.27-bookworm
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Install ko
        run: |
          go install github.com/google/ko@v0.19.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Login to Codeberg registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | "$(go env GOPATH)/bin/ko" login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
      - name: Build and push image
        run: |
          ko build --bare \
            --platform=linux/amd64,linux/arm64 \
            --sbom=none \
            --tags="$GITHUB_REF_NAME" \
            ./cmd

  chart:
    runs-on: docker
    container:
      image: alpine/helm:4.3.0
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Build and push Helm chart
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          helm_version="${GITHUB_REF_NAME#v}"
          helm registry login "$REGISTRY" -u "$REGISTRY_USERNAME" -p "$REGISTRY_TOKEN"
          helm package --app-version "$GITHUB_REF_NAME" --version "$helm_version" charts/netbird-operator
          helm push "netbird-operator-${helm_version}.tgz" "$CHART_OCI"