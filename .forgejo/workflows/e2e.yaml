name: e2e

# The e2e suite builds an image and runs kind, which needs to create containers.
# That requires a runner configured to allow privileged job containers — which
# the current shared runner does not. It is therefore not part of the push/PR
# pipeline; run it manually on a capable runner (or re-add a `push`/`pull_request`
# trigger once such a runner is available).
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: docker
    container:
      # Builder image with podman/buildah preinstalled.
      image: quay.io/podman/stable:latest
      options: --privileged
    env:
      CONTAINER_ENGINE: podman
      KIND_EXPERIMENTAL_PROVIDER: podman
      DOCKER_HOST: unix:///run/podman/podman.sock
      GOTOOLCHAIN: auto
    steps:
      - name: Install build dependencies
        run: dnf install -y git make golang
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Run e2e tests
        run: make -B test-e2e