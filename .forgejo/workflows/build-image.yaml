name: build-image

# Builds and pushes a multi-arch operator image to the Codeberg package registry
# on every branch push and on demand, so a fork/dev build can be tested in a
# cluster without cutting a release (that path is handled by release.yaml).
#
# The image is assembled with `ko`, which cross-compiles and pushes the
# multi-arch manifest directly — no Docker daemon or privileged runner needed.
on:
  push:
    branches:
      - '**'
      # Dependency bumps are never deployed from their own branch — they land on
      # main first — so skip the multi-arch image + per-branch dev chart for
      # them (go.yaml still lints/tests the PR). Use workflow_dispatch if one
      # ever needs a real build.
      - '!renovate/**'
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (defaults to the sanitized branch name)'
        required: false
        type: string

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: codeberg.org
  KO_DOCKER_REPO: codeberg.org/ccbash-oss/netbird-operator
  KO_DEFAULTBASEIMAGE: gcr.io/distroless/static:nonroot
  CHART_OCI: oci://codeberg.org/ccbash-oss/helm-charts

jobs:
  image:
    runs-on: docker
    container:
      image: golang:1.27-bookworm
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Resolve image tags
        id: tags
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            ref_tag="${{ github.event.inputs.tag }}"
          else
            ref_tag=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          sha_tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "ref_tag=${ref_tag}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "tags=${sha_tag},${ref_tag}" >> "$GITHUB_OUTPUT"
      - name: Install ko
        run: |
          go install github.com/google/ko@v0.19.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Login to Codeberg registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | "$(go env GOPATH)/bin/ko" login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
      - name: Build and push image
        run: |
          ko build --bare \
            --platform=linux/amd64,linux/arm64 \
            --sbom=none \
            --tags="${{ steps.tags.outputs.tags }}" \
            ./cmd
          {
            echo "### Pushed image"
            echo '```'
            echo "${KO_DOCKER_REPO}:${{ steps.tags.outputs.sha_tag }}"
            echo "${KO_DOCKER_REPO}:${{ steps.tags.outputs.ref_tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    runs-on: docker
    container:
      image: alpine/helm:4.3.0
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Resolve tags
        id: tags
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            ref_tag="${{ github.event.inputs.tag }}"
          else
            ref_tag=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          sha_tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "ref_tag=${ref_tag}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
      - name: Build and push Helm chart
        # Publish a per-branch dev chart so each development stream is isolated
        # and ships its own (possibly changed) CRDs. The branch lives in the
        # chart NAME (netbird-operator-<branch>) — not the version, because Helm
        # versions must be semver and Flux can't select "latest prerelease of a
        # branch". The version is a plain, monotonically increasing
        # 0.0.<run_number> so Flux orders it; a HelmRelease pinned to
        # chart: netbird-operator-<branch> + version "0.0.x" tracks that branch.
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          chart_name="netbird-operator-${{ steps.tags.outputs.ref_tag }}"
          chart_version="0.0.${{ github.run_number }}"
          sed -i "s/^name: .*/name: ${chart_name}/" charts/netbird-operator/Chart.yaml
          helm registry login "$REGISTRY" -u "$REGISTRY_USERNAME" -p "$REGISTRY_TOKEN"
          helm package --app-version "${{ steps.tags.outputs.sha_tag }}" --version "${chart_version}" charts/netbird-operator
          helm push "${chart_name}-${chart_version}.tgz" "$CHART_OCI"
          {
            echo "### Pushed chart"
            echo '```'
            echo "${CHART_OCI}/${chart_name}:${chart_version}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"