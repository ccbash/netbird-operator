name: go

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  lint:
    runs-on: docker
    container:
      image: golangci/golangci-lint:v2.13.2
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v git >/dev/null 2>&1 || apk add --no-cache git
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Run linter
        run: golangci-lint run ./...

  test:
    runs-on: docker
    container:
      image: golang:1.27-bookworm
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Verify go mod is not dirty
        run: |
          go mod tidy
          git diff --exit-code
      - name: Verify generate is not dirty
        run: |
          make -B generate
          git diff --exit-code
      - name: Run unit tests
        run: make test-unit