name: go

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  lint:
    runs-on: docker
    container:
      image: golangci/golangci-lint:v2.13.2
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v git >/dev/null 2>&1 || apk add --no-cache git
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Run linter
        run: golangci-lint run ./...

  test:
    runs-on: docker
    container:
      image: golang:1.27-bookworm
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Verify go mod is not dirty
        run: |
          go mod tidy
          git diff --exit-code
      - name: Verify generate is not dirty
        run: |
          make -B generate
          git diff --exit-code
      - name: Run unit tests
        run: make test-unit

  e2e:
    runs-on: docker
    # Heavy (builds an image, needs a container runtime). Run on PRs and main
    # pushes; skip on direct release-branch pushes — lint+test still run there,
    # and PRs into a release branch exercise e2e.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    # kind needs to create containers, which requires the runner to allow
    # privileged job containers. Until then this job cannot pass here, so it is
    # non-blocking; lint and test remain the gates.
    continue-on-error: true
    container:
      # Builder image with podman/buildah preinstalled. Privileged only takes
      # effect if the runner itself is configured to permit it.
      image: quay.io/podman/stable:latest
      options: --privileged
    env:
      CONTAINER_ENGINE: podman
      KIND_EXPERIMENTAL_PROVIDER: podman
      DOCKER_HOST: unix:///run/podman/podman.sock
      GOTOOLCHAIN: auto
    steps:
      - name: Install build dependencies
        run: dnf install -y git make golang
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          url="https://codeberg.org/${GITHUB_REPOSITORY}.git"
          [ -n "${GITHUB_TOKEN:-}" ] && url="https://x-access-token:${GITHUB_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q --force FETCH_HEAD
      - name: Run e2e tests
        run: make -B test-e2e