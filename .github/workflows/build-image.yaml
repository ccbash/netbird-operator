name: build-image
# Builds and pushes a multi-arch operator image to GHCR on every branch push
# and on demand, so a fork/dev build can be tested in a cluster without cutting
# a GitHub release (that path is handled by release.yaml).
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push (defaults to the sanitized branch name)'
        required: false
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 #v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0
        with:
          driver: docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 #v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          # Moving tag: explicit dispatch input, else the branch name with any
          # non-tag-safe characters (e.g. "/") replaced by "-".
          if [[ -n "${{ inputs.tag }}" ]]; then
            ref_tag="${{ inputs.tag }}"
          else
            ref_tag="${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/-}"
          fi
          echo "ref_tag=${ref_tag}" >> "$GITHUB_OUTPUT"
          # Immutable tag for pinning in a HelmRelease.
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          repo="${{ github.repository_owner }}/netbird-operator"
          # Build once tagged with the immutable SHA tag, push it, then attach
          # the moving ref tag to the same multi-arch manifest and push that.
          IMG_REF=$(make build-image-multiarch \
            IMG_REPOSITORY="${repo}" \
            IMG_TAG="${{ steps.tags.outputs.sha_tag }}") || exit 1
          docker push "${IMG_REF}"
          REF_IMG="ghcr.io/${repo}:${{ steps.tags.outputs.ref_tag }}"
          docker tag "${IMG_REF}" "${REF_IMG}"
          docker push "${REF_IMG}"
          {
            echo "### Pushed image"
            echo '```'
            echo "${IMG_REF}"
            echo "${REF_IMG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push Helm chart
        # Publish a per-branch dev chart so each development stream is isolated
        # and ships its own (possibly changed) CRDs. The branch lives in the
        # chart NAME (netbird-operator-<branch>) — not the version, because Helm
        # versions must be semver and Flux can't select "latest prerelease of a
        # branch". The version is a plain, monotonically increasing
        # 0.0.<run_number> so Flux orders it; a HelmRelease pinned to
        # chart: netbird-operator-<branch> + version "0.0.x" tracks that branch.
        run: |
          owner="${{ github.repository_owner }}"
          chart_name="netbird-operator-${{ steps.tags.outputs.ref_tag }}"
          chart_version="0.0.${{ github.run_number }}"
          sed -i "s/^name: .*/name: ${chart_name}/" charts/netbird-operator/Chart.yaml
          helm package --app-version "${{ steps.tags.outputs.sha_tag }}" --version "${chart_version}" charts/netbird-operator
          helm push "${chart_name}-${chart_version}.tgz" "oci://ghcr.io/${owner}/helm-charts"
          {
            echo "### Pushed chart"
            echo '```'
            echo "oci://ghcr.io/${owner}/helm-charts/${chart_name}:${chart_version}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
